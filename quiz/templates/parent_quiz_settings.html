{% extends 'parent_base.html' %}
{% block content %}
{% import '_icons.html' as ico %}
<style>.quiz-settings-shell{max-width:680px;margin:0 auto}.quiz-settings-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.setting-box{display:grid;gap:16px}.setting-field label{display:block;font-size:12px;font-weight:750;color:#334155;margin-bottom:6px}.setting-field input[type=number]{width:100%;min-height:44px;border:1px solid #cbd5e1;border-radius:11px;padding:8px 12px}.setting-toggle{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa}</style>
<div class="quiz-settings-shell"><div class="quiz-settings-head"><div><h2 style="margin:0;">Learning settings</h2><p class="text-muted" style="margin:4px 0 0;">Configure healthy learning breaks for this child.</p></div><a class="btn outline" href="/parent/learning-report/?child_id={{ child_id }}">View report</a></div><form class="parent-card setting-box" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="child_id" value="{{ child_id }}"><div class="setting-field"><label for="quiz-frequency">Show a quiz after this many content views</label><input id="quiz-frequency" name="quiz_frequency" type="number" min="1" max="50" value="{{ settings.quiz_frequency if settings else 5 }}" required><small class="text-muted">Allowed range: 1–50 views.</small></div><label class="setting-toggle"><input type="checkbox" name="mandatory_quiz" {% if settings and settings.mandatory_quiz %}checked{% endif %}><span><b>Mandatory learning break</b><br><small class="text-muted">When enabled, the child completes the scheduled quiz before continuing.</small></span></label><div style="display:flex;justify-content:flex-end;gap:8px;"><a class="btn outline" href="/parent/dashboard/">Cancel</a><button class="btn primary" type="submit">{{ ico.icon('check',15) }} Save settings</button></div></form></div>
{% endblock %}
