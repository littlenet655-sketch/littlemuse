name: LittleNet CI

on:
  push:
    branches: [main, master, react-native-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://littlenet:littlenet@localhost:5432/littlenet_test?sslmode=disable
      APP_TIMEZONE: Asia/Kolkata
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: littlenet
          POSTGRES_PASSWORD: littlenet
          POSTGRES_DB: littlenet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littlenet -d littlenet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS model artifacts are real binaries
        run: |
          set -euo pipefail
          fail=0
          for f in $(git lfs ls-files -n 2>/dev/null || true); do
            if [ ! -f "$f" ]; then echo "MISSING LFS FILE: $f"; fail=1; continue; fi
            if head -c 200 "$f" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "LFS POINTER STUB (not a real binary): $f"; fail=1
            fi
          done
          for f in models/littlenet_core_safety_v2.pth models/littlenet_weapons_violence_v3.pth models/littlenet_text_safety/model.safetensors; do
            if [ ! -f "$f" ]; then echo "MISSING REQUIRED MODEL: $f"; fail=1; fi
          done
          exit $fail
      - name: Install FFmpeg (media test dependency)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install source-audit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/download/v2.34.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate
          dbmate --version
      - name: Initialize PostgreSQL test database
        run: |
          python tools/init_db.py
          dbmate --no-dump-schema --migrations-dir db/migrations up
          dbmate --no-dump-schema --migrations-dir db/migrations status
      - name: Run migration-critical backend tests
        run: python -m pytest -q tests/test_react_native_contract.py tests/test_phase2_upload_and_tags.py tests/test_ai_hardening.py tests/test_ai_safety_contract.py
      - name: Run Agent-A state-machine regression suites
        run: python -m pytest -q tests/test_agent_a_state_machine_and_face.py
      - name: Run Agent-A targeted PostgreSQL concurrency and lease suites
        run: python -m pytest -q tests/test_agent_a_disposable_postgres.py
      - name: Run full backend regression suite
        run: python -m pytest tests/ -q
      - name: Run local source audits
        run: python tools/audit_all.py
      - name: Enforce parameterized SQL identifiers
        run: python tools/audit_dynamic_sql.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify Git LFS model artifacts are real binaries
        run: |
          set -euo pipefail
          fail=0
          for f in $(git lfs ls-files -n 2>/dev/null || true); do
            if [ ! -f "$f" ]; then echo "MISSING LFS FILE: $f"; fail=1; continue; fi
            if head -c 200 "$f" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "LFS POINTER STUB (not a real binary): $f"; fail=1
            fi
          done
          for f in models/littlenet_core_safety_v2.pth models/littlenet_weapons_violence_v3.pth models/littlenet_text_safety/model.safetensors; do
            if [ ! -f "$f" ]; then echo "MISSING REQUIRED MODEL: $f"; fail=1; fi
          done
          exit $fail
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS model artifacts are real binaries
        run: |
          set -euo pipefail
          fail=0
          for f in $(git lfs ls-files -n 2>/dev/null || true); do
            if [ ! -f "$f" ]; then echo "MISSING LFS FILE: $f"; fail=1; continue; fi
            if head -c 200 "$f" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "LFS POINTER STUB (not a real binary): $f"; fail=1
            fi
          done
          for f in models/littlenet_core_safety_v2.pth models/littlenet_weapons_violence_v3.pth models/littlenet_text_safety/model.safetensors; do
            if [ ! -f "$f" ]; then echo "MISSING REQUIRED MODEL: $f"; fail=1; fi
          done
          exit $fail
      - name: Install security scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Audit core web/runtime dependencies
        run: pip-audit -r requirements-core.txt --progress-spinner off
      - name: Audit extended AI/text/safety dependencies
        run: |
          pip-audit -r requirements-text.txt --progress-spinner off
          pip-audit -r requirements-safety.txt --progress-spinner off
          pip-audit -r requirements-ai.txt --progress-spinner off
      - name: Bandit application scan
        run: >-
          bandit -r admin auth child childMessage parent quiz safety services uploadPost mobile
          -x tests
          -ll
          -s B608
