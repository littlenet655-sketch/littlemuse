name: Verify LittleNet Live R2 Media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release/probe-live-media.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      LITTLENET_WEB_SECRET: littlemuse-web-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "modal>=1.5,<2"
      - name: Verify Modal authentication
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          modal token info
      - name: Run real production R2 image + Reel probe
        run: |
          set -euo pipefail
          modal run tools/live_release_media_probe.py | tee live-media-probe.log
          grep -q 'LIVE_MEDIA_PROBE .*"ok": true' live-media-probe.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: littlenet-live-media-probe
          path: live-media-probe.log
          if-no-files-found: ignore
          retention-days: 14
