name: Validate LittleNet Staging

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS LittleNet staging URL, without a trailing slash"
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Verify Git LFS model artifacts are real binaries
        run: |
          set -euo pipefail
          fail=0
          for f in $(git lfs ls-files -n 2>/dev/null || true); do
            if [ ! -f "$f" ]; then echo "MISSING LFS FILE: $f"; fail=1; continue; fi
            if head -c 200 "$f" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "LFS POINTER STUB (not a real binary): $f"; fail=1
            fi
          done
          for f in models/littlenet_core_safety_v2.pth models/littlenet_weapons_violence_v3.pth models/littlenet_text_safety/model.safetensors; do
            if [ ! -f "$f" ]; then echo "MISSING REQUIRED MODEL: $f"; fail=1; fi
          done
          exit $fail
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install latest Playwright test runner
        run: npm install --no-save @playwright/test@latest
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run LittleNet release smoke suite
        run: npx playwright test --project=chromium
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-release-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Verify Git LFS model artifacts are real binaries
        run: |
          set -euo pipefail
          fail=0
          for f in $(git lfs ls-files -n 2>/dev/null || true); do
            if [ ! -f "$f" ]; then echo "MISSING LFS FILE: $f"; fail=1; continue; fi
            if head -c 200 "$f" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "LFS POINTER STUB (not a real binary): $f"; fail=1
            fi
          done
          for f in models/littlenet_core_safety_v2.pth models/littlenet_weapons_violence_v3.pth models/littlenet_text_safety/model.safetensors; do
            if [ ! -f "$f" ]; then echo "MISSING REQUIRED MODEL: $f"; fail=1; fi
          done
          exit $fail
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.base_url }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-release-evidence
