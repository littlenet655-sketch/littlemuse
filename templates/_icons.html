{% macro brand_wordmark(height=30) -%}
<svg width="{{ (height*200/48)|round|int }}" height="{{height}}" viewBox="0 0 200 48" fill="none" role="img" aria-label="LittleNet">
<text x="6" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="700" font-size="28" fill="#262626" letter-spacing="-0.8">LittleNet</text>
<circle cx="128" cy="18" r="4" fill="#0095F6"/>
<path d="M142 28 C145 22, 153 22, 156 28" stroke="#0095F6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
{%- endmacro %}
