{% extends 'base.html' %}{% block content %}{% import '_icons.html' as ico %}<h2 style="padding:0 14px">{{title}}</h2><div class="chat-list">{% for p in people %}<a href="/child/view-profile/{{p.user_id}}/"><img class="avatar" style="width:48px;height:48px" src="/{{p.profile_picture if p.profile_picture else 'uploads/profile_pictures/download.webp'}}" data-hide-error alt="{{p.full_name}}"><b>{{p.full_name}}</b></a>{% else %}<div class="empty-state"><div class="empty-illustration">{{ico.icon('user',42)}}</div><h3>Nobody here yet</h3><p>Nothing to show for {{title|lower}} right now.</p></div>{% endfor %}</div>{% endblock %}
